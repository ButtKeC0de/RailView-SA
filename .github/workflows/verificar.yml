name: Verificar PHP e banco demo

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: demo-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Sintaxe e regras PHP
        run: |
          set -euo pipefail
          php --version
          find infra public scripts -name '*.php' -print0 | xargs -0 -n1 php -l
          php scripts/verificar_demo.php
          php scripts/verificar_alertas.php
      - name: Importação repetida e integridade dos exemplos
        env:
          MYSQL_PWD: demo-ci-only
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -u root < database/SA_ferrorama.sql
          mysql -h 127.0.0.1 -u root < database/SA_ferrorama.sql
          test "$(mysql -h 127.0.0.1 -u root -N -e 'SELECT COUNT(*) FROM rail_view_db.Usuario')" = 3
          test "$(mysql -h 127.0.0.1 -u root -N -e 'SELECT COUNT(*) FROM rail_view_db.Trem')" = 2
          test "$(mysql -h 127.0.0.1 -u root -N -e 'SELECT COUNT(*) FROM rail_view_db.Sensor')" = 2
          test "$(mysql -h 127.0.0.1 -u root -N -e 'SELECT COUNT(*) FROM rail_view_db.Rota')" = 2
          test "$(mysql -h 127.0.0.1 -u root -N -e 'SELECT COUNT(*) FROM rail_view_db.Historico_Rota')" = 2
          test "$(mysql -h 127.0.0.1 -u root -N -e 'SELECT COUNT(*) FROM rail_view_db.Limite_Sensor')" = 2

  publicar-versao:
    needs: verificar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publicar v1.0.0 após verificações
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo 'v1.0.0 já existe; preservando a versão publicada.'
          else
            gh release create v1.0.0 --target "$GITHUB_SHA" --title 'Rail View v1.0.0' --notes-file docs/release-v1.0.0.md
          fi
